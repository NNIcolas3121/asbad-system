<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASBAD System | هوشمندسازی معادن</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #E65100;
            --brand-gradient: linear-gradient(135deg, #FF9800, #E65100);
            --text-dark: #212121;
            --text-light: #757575;
            --white: #ffffff;
            --bg-phone: #E3F2FD;
            --bg-whatsapp: #E8F5E9;
            --bg-insta: #FCE4EC;
            --bg-sms: #FFF3E0;
            --bg-telegram: #E1F5FE;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--brand-gradient);
            color: var(--text-dark);
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header {
            margin-bottom: 35px;
        }
        /* استایل لوگوی گرافیکی جدید */
        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            position: relative;
        }
        .logo-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--brand-primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 10px 15px rgba(230, 81, 0, 0.3));
        }
        .logo-circle {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 3px solid var(--brand-primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.1; }
            100% { transform: scale(0.95); opacity: 0.3; }
        }
        h1 {
            font-size: 1.8rem;
            margin: 10px 0 5px;
            color: var(--text-dark);
            font-weight: 900;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 1rem;
            margin: 0;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 18px 10px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
        }
        .btn i {
            margin-left: 10px;
            font-size: 1.4rem;
            transition: transform 0.3s;
        }
        .btn-phone { background-color: var(--bg-phone); color: #1976D2; }
        .btn-whatsapp { background-color: var(--bg-whatsapp); color: #388E3C; }
        .btn-instagram { background-color: var(--bg-insta); color: #C2185B; }
        .btn-sms { background-color: var(--bg-sms); color: #F57C00; }
        .btn-telegram { background-color: var(--bg-telegram); color: #0288D1; }
        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            color: var(--white);
        }
        .btn:hover.btn-phone { background-color: #1976D2; }
        .btn:hover.btn-whatsapp { background-color: #25D366; }
        .btn:hover.btn-instagram { background-color: #E1306C; }
        .btn:hover.btn-sms { background-color: #F57C00; }
        .btn:hover.btn-telegram { background-color: #0088cc; }
        .btn:hover i {
            transform: scale(1.2) rotate(10deg);
        }
        .map-section {
            margin-top: 30px;
            text-align: right;
        }
        .map-title {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .map-container {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: grayscale(20%);
        }
        .map-container:hover iframe {
            filter: grayscale(0%);
        }
        .map-link {
            display: block;
            margin-top: 10px;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-box">
                    <div class="logo-circle"></div>
                    <!-- لوگوی گرافیکی SVG -->
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="40" stroke-width="4" />
                        <path d="M30 70 L50 30 L70 70" stroke-width="4" />
                        <path d="M40 70 L50 45 L60 70" stroke-width="3" />
                        <line x1="50" y1="30" x2="50" y2="20" stroke-width="3" />
                        <circle cx="50" cy="18" r="3" fill="var(--brand-primary)" stroke="none"/>
                    </svg>
                </div>
                <h1>ASBAD System</h1>
                <p class="subtitle">پیشرو در هوشمندسازی و اتوماسیون معادن</p>
            </div>
            <div class="grid">
                <a href="tel:+989151213147" class="btn btn-phone">
                    <i class="fa-solid fa-phone"></i> تماس
                </a>
                <a href="https://wa.me/989151213147" class="btn btn-whatsapp" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> واتس‌اپ
                </a>
                <!-- اینستاگرام فعلاً غیرفعال است -->
                <a href="#" class="btn btn-instagram">
                    <i class="fa-brands fa-instagram"></i> اینستاگرام
                </a>
                <a href="sms:+989151213147" class="btn btn-sms">
                    <i class="fa-solid fa-comment-sms"></i> پیامک
                </a>
                <!-- تلگرام فعلاً غیرفعال است -->
                <a href="#" class="btn btn-telegram">
                    <i class="fa-brands fa-telegram"></i> تلگرام
                </a>
            </div>
            <div class="map-section">
                <div class="map-title">
                    <i class="fa-solid fa-map-location-dot" style="color: var(--brand-primary);"></i>
                    دفتر مرکزی (بیرجند)
                </div>
                <div class="map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d40000!2d60.17711663674137!3d34.44165778240243!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzTCsDI2JzI5LjkiTiA2MMKwMTAnMzcuNiJF!5e0!3m2!1sen!2s!4v1600000000000!5m2!1sen!2s" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
                <a href="https://www.google.com/maps/search/?api=1&query=34.44165778240243,60.17711663674137" target="_blank" class="map-link">
                    باز کردن در گوگل مپ <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
        <div class="footer">
            © ۱۴۰۳ ASBAD System | راهکارهای هوشمند معدنی
        </div>
    </div>
</body>
</html>
